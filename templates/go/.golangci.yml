version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gocritic
    - revive
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
