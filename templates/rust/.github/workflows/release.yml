  # cargo-publish:
  #   needs: [release]
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   permissions:
  #     contents: read
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #     - uses: rust-lang/crates-io-auth-action@v1
  #       id: auth
  #     - run: cargo publish --locked
  #       env:
  #         CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
